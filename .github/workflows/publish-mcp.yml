name: Publish to MCP Registry

on:
  workflow_call:
    secrets:
      MCP_KEY:
        required: true
  workflow_dispatch:

jobs:
  publish-mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Wait for package to be available on npm
        working-directory: packages/mcp-stdio
        run: |
          PACKAGE=$(jq -r '.packages[] | select(.registryType == "npm") | .identifier' server.json)
          VERSION=$(jq -r '.packages[] | select(.registryType == "npm") | .version' server.json)
          MCP_NAME=$(jq -r '.name' server.json)

          # The MCP Registry validates the package against this exact endpoint, so wait until it's served
          for i in $(seq 1 30); do
            if curl -fsSL "https://registry.npmjs.org/${PACKAGE}/${VERSION}" | jq -e --arg name "$MCP_NAME" '.mcpName == $name' > /dev/null; then
              echo "${PACKAGE}@${VERSION} is available on npm"
              exit 0
            fi
            echo "Attempt $i: ${PACKAGE}@${VERSION} not yet available on npm, retrying in 20s..."
            sleep 20
          done

          echo "Timed out waiting for ${PACKAGE}@${VERSION} to be available on npm"
          exit 1

      - name: Publish to MCP Registry
        working-directory: packages/mcp-stdio
        env:
          MCP_KEY: ${{ secrets.MCP_KEY }}
        run: |
          NAME=mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz
          # Download MCP Publisher pinned to v1.4.0 using latest https for security and save it to a file named mcp-publisher.tar.gz
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fL "https://github.com/modelcontextprotocol/registry/releases/download/v1.4.0/$NAME" -O

          # Verify the SHA256 checksum of the downloaded file
          sha256sum --ignore-missing -c ./checksums/registry_1.4.0_checksums.txt

          # Extract the tarball
          mkdir tmp
          tar -xzf $NAME --no-same-owner --no-same-permissions -C tmp

          # Install the MCP Publisher binary
          install -m 0755  tmp/mcp-publisher .

          # Login using DNS and publish to MCP Registry, retrying in case the registry still sees a stale npm cache
          # (login is repeated on each attempt since registry tokens are short-lived)
          for i in $(seq 1 5); do
            if ./mcp-publisher login dns --domain svelte.dev --private-key "${MCP_KEY}" && ./mcp-publisher publish; then
              exit 0
            fi
            echo "Attempt $i: publish failed, retrying in $((i * 30))s..."
            sleep $((i * 30))
          done

          echo "Failed to publish to MCP Registry"
          exit 1
