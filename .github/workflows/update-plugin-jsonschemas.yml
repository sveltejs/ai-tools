name: Update Plugin JSON Schemas

on:
  push:
    branches:
      - main
    paths:
      - 'packages/opencode/config.js'
      - 'packages/pi/config.js'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    # prevents this action from running on forks
    if: github.repository == 'sveltejs/ai-tools'
    name: Update Plugin JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false # pnpm is not installed yet

      - name: Install pnpm
        shell: bash
        run: |
          PNPM_VER=$(jq -r '.packageManager | if .[0:5] == "pnpm@" then .[5:] else "packageManager in package.json does not start with pnpm@\n" | halt_error(1)  end' package.json)
          echo installing pnpm version $PNPM_VER
          npm i -g pnpm@$PNPM_VER

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: true # caches pnpm via packageManager field in package.json
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Generate plugin JSON schemas
        run: |
          pnpm generate-opencode-jsonschema
          pnpm generate-pi-jsonschema
          pnpm exec prettier --write packages/opencode/schema.json packages/pi/schema.json

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code -- packages/opencode/schema.json packages/pi/schema.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: update plugin JSON schemas'
          branch: docs/update-plugin-jsonschemas
          delete-branch: true
          title: 'docs: update plugin JSON schemas'
          body: |
            ## Summary
            Automatically generated updates for OpenCode and Pi JSON schemas.

            This PR was triggered by changes to `packages/opencode/config.js` or `packages/pi/config.js`.

            ## Changes
            - Regenerated `packages/opencode/schema.json` and `packages/pi/schema.json` from their configuration schemas

            ## Generated by
            GitHub Action: Update Plugin JSON Schemas
          labels: |
            automated
